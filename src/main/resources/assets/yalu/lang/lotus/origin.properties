meteor-miku_A使用教程=A使用教程
meteor-miku_A使用教程_d=📚 Miku插件完整使用指南和设置教程\n\n✨ 本模块将指导您完成以下设置：\n🔤 字体设置 - 配置中文字体确保界面正常显示\n🌐 VIA版本 - 设置正确的VIA版本(1.20.6)以获得最佳兼容性\n📦 前置MOD - 检查并指导安装必要的前置MOD\n\n⚡ 主要功能：\n• 自动设置中文字体(等线/Dengxian)\n• 智能检查VIA版本兼容性\n• 检测Baritone、Xaero地图、Litematica、ViaFabricPlus等前置MOD\n• 分步骤的渐进式教程系统\n• 快速指南和状态查询功能\n\n💡 使用建议：\n首次使用Miku插件时请启用本模块，\n按照教程完成基本设置以获得最佳体验！
