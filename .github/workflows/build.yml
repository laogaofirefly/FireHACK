name: Build

concurrency:
  group: "build"
  cancel-in-progress: false

on:
  push:
    branches:
      - "main"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Build Baritone from source
        uses: actions/checkout@v4
        with:
          repository: MeteorDevelopment/baritone
          ref: 1.21.11
          path: .baritone
      - name: Publish Baritone to local Maven repository
        working-directory: .baritone
        run: |
          ./gradlew :fabric:build --no-daemon --stacktrace
          ./gradlew :fabric:publishToMavenLocal --no-daemon --stacktrace
      - name: Set up Node JS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Get current build number
        id: build-number
        run: |
          cd .github/builds
          npm install
          npm run --silent get_number >> $GITHUB_OUTPUT

      - name: Build
        run: ./gradlew build -Pcommit=${{ github.sha }} -Pbuild_number=${{ steps.build-number.outputs.number }}

      - name: Webhook Failure
        if: ${{ failure() }}
        run: |
          cd .github/builds
          npm run webhook -- ${{ steps.build-number.outputs.number || github.run_number }} ${{ github.ref_name }} https://api.github.com/repos/laogaofirefly/FireHACK/compare/${{ github.event.before }}...${{ github.event.after }} false
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

      # Maven publishing is intentionally disabled. The CI build is the source of truth
      # for this fork, and the upstream Meteor Maven credentials are not required.

      - name: Discord webhook
        run: |
          cd .github/builds
          npm run webhook -- ${{ steps.build-number.outputs.number || github.run_number }} ${{ github.ref_name }} https://api.github.com/repos/laogaofirefly/FireHACK/compare/${{ github.event.before }}...${{ github.event.after }} true
        env:
          SERVER_TOKEN: ${{ secrets.SERVER_TOKEN }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
